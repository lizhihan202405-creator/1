<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>香港西九龙辐射图 - 珠三角版</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; background-color: #020617; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map-container { 
            width: 95vw; 
            height: 90vh; 
            background: radial-gradient(circle at 60% 50%, #1e293b 0%, #020617 70%);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        /* 标题样式 */
        .map-header {
            position: absolute; top: 30px; left: 30px; z-index: 10; color: #f8fafc;
        }
        .map-header h2 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 1px; }
        .map-header p { margin: 5px 0 0; font-size: 13px; color: #94a3b8; }
        
        /* 图例样式 */
        .legend {
            position: absolute; bottom: 30px; left: 30px; z-index: 10;
            display: flex; gap: 20px; background: rgba(15, 23, 42, 0.8);
            padding: 12px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
        }
        .legend-item { display: flex; align-items: center; color: #cbd5e1; font-size: 12px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>

    <div id="map-container">
        <div class="map-header">
            <h2>香港西九龙辐射图</h2>
            <p>大湾区各站最快到达时间（悬停查看详情）</p>
        </div>

        <div id="chart" style="width: 100%; height: 100%;"></div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: #fbbf24;"></div>≤20 min</div>
            <div class="legend-item"><div class="dot" style="background: #f97316;"></div>≤35 min</div>
            <div class="legend-item"><div class="dot" style="background: #38bdf8;"></div>≤55 min</div>
            <div class="legend-item"><div class="dot" style="background: #1e40af;"></div>>55 min</div>
        </div>
    </div>

<script>
    var chartDom = document.getElementById('chart');
    var myChart = echarts.init(chartDom);

    // 站点坐标数据（模拟地理相对位置）
    const nodes = [
        { name: '香港西九龙', value: [114.16, 22.30, 0], time: '起点', color: '#fbbf24' },
        { name: '福田', value: [114.05, 22.54, 14], time: '14 min', color: '#fbbf24' },
        { name: '深圳北', value: [114.03, 22.61, 23], time: '约 23 分钟', color: '#f97316' },
        { name: '广州新塘', value: [113.61, 23.12, 52], time: '52 min', color: '#38bdf8' },
        { name: '广州南', value: [113.27, 22.99, 60], time: '60 min', color: '#1e40af' },
        { name: '广州东', value: [113.32, 23.15, 75], time: '75 min', color: '#1e40af' }
    ];

    // 连线数据
    const lines = [
        { from: '香港西九龙', to: '福田', coords: [[114.16, 22.30], [114.05, 22.54]] },
        { from: '福田', to: '深圳北', coords: [[114.05, 22.54], [114.03, 22.61]] },
        { from: '深圳北', to: '广州新塘', coords: [[114.03, 22.61], [113.61, 23.12]] },
        { from: '深圳北', to: '广州南', coords: [[114.03, 22.61], [113.27, 22.99]] },
        { from: '广州新塘', to: '广州东', coords: [[113.61, 23.12], [113.32, 23.15]] }
    ];

    var option = {
        backgroundColor: 'transparent',
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(15, 23, 42, 0.9)',
            borderWidth: 0,
            textStyle: { color: '#fff' },
            formatter: function(params) {
                if(params.seriesType === 'effectScatter') {
                    return `<div style="padding:5px"><b>${params.data.name}</b><br/>耗时: ${params.data.time}</div>`;
                }
            }
        },
        geo: {
            map: 'world', // 这里使用简化坐标系
            show: false,
            roam: false,
            center: [113.7, 22.7],
            zoom: 12
        },
        series: [
            // 1. 绘制流光线条
            {
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 1,
                effect: {
                    show: true,
                    period: 4,
                    trailLength: 0.7,
                    color: '#fff',
                    symbolSize: 3
                },
                lineStyle: {
                    color: '#475569',
                    width: 1,
                    curveness: 0.1,
                    type: 'dashed'
                },
                data: lines
            },
            // 2. 绘制实线路径
            {
                type: 'lines',
                coordinateSystem: 'geo',
                zlevel: 2,
                lineStyle: {
                    color: '#64748b',
                    width: 2,
                    curveness: 0.1
                },
                data: lines
            },
            // 3. 绘制站点和波纹动效
            {
                type: 'effectScatter',
                coordinateSystem: 'geo',
                zlevel: 3,
                rippleEffect: {
                    brushType: 'stroke',
                    scale: 4,
                    number: 3
                },
                label: {
                    show: true,
                    position: 'top',
                    formatter: '{b}',
                    color: '#e2e8f0',
                    fontSize: 12
                },
                symbolSize: 10,
                itemStyle: {
                    color: function(params) { return params.data.color; },
                    shadowBlur: 10,
                    shadowColor: '#000'
                },
                data: nodes
            }
        ]
    };

    myChart.setOption(option);

    // 响应式自适应
    window.addEventListener('resize', function() {
        myChart.resize();
    });
</script>
</body>
</html>
